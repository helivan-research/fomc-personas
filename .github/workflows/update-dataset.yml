name: Update HF dataset

# Weekly incremental refresh of the helivan/fomc-personas Hugging Face dataset: scrape each member's
# new public documents, extract + embed the new passages, and push the changed shards back to HF.
# Incremental, so a run with nothing new does (almost) no work and no push.
#
# Requires two repository secrets:
#   OPENAI_API_KEY  — chunk extraction (gpt-4o-mini) + embeddings (text-embedding-3-large)
#   HF_TOKEN        — write access to the helivan/fomc-personas dataset (also reads it for the pull)
#
# Optional, to auto-refresh the live federalreserve.ai site after the dataset updates (restarts the
# Railway service, which re-syncs the corpus from HF on boot):
#   RAILWAY_TOKEN       — a Railway *project* token (Railway → project → Settings → Tokens)
#   RAILWAY_SERVICE_ID  — the web service's ID (Railway → service → Settings, or from the URL)
# Both unset -> the redeploy step is skipped.
#
# The weekly INDEX job (scripts/update_index.py) runs after the refresh job WHATEVER its outcome --
# a slow or failed scrape must never block the index. It extends the index over newly-completed FOMC
# meetings, re-forecasts the next meeting from this week's data, commits the caches, and pushes the
# site's pbi.json to the web repo (Railway deploys on that push, which also re-syncs the corpus):
#   WEB_PUSH_TOKEN      — fine-grained PAT with contents:write on helivan-research/fomc-personas-web
# Unset -> caches still update in this repo; the site publish step is skipped.
# Manual run with index_only=true skips the ~1.5h scrape (e.g. right after an FOMC meeting).

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      index_only:
        description: 'Skip the corpus scrape; run only the index update + site publish'
        type: boolean
        default: false

permissions:
  contents: write   # push updated generation caches back to this repo after an index update

concurrency:
  group: update-dataset
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ !inputs.index_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install poppler-utils (pdftotext, for FOMC transcript PDFs)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (BIS president-speech scraper)
        run: python -m playwright install --with-deps chromium

      - name: Scrape, extract, embed, and push to HF
        id: refresh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python data/scrape/build_dataset.py --all --pull --push

      # Restart the live site so it re-syncs the freshened corpus from HF on boot. Skipped gracefully
      # if the Railway secrets aren't configured (the index job's weekly web push redeploys anyway).
      - name: Redeploy the live site (Railway)
        if: success() && steps.refresh.outputs.pushed == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skipping live-site redeploy."
            exit 0
          fi
          npm install -g @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE_ID" --yes

  index:
    needs: refresh
    if: ${{ always() }}          # run even if the scrape failed, timed out, or was skipped
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Response embeddings are content-hashed on disk; reusing them across runs keeps the weekly
      # re-export from re-embedding every cached persona answer.
      - name: Restore embedding cache
        uses: actions/cache@v4
        with:
          path: .cache/embeddings
          key: embeddings-${{ github.run_id }}
          restore-keys: embeddings-

      - name: Update index caches and forecast the next meeting
        id: index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/update_index.py

      - name: Commit updated index caches
        if: steps.index.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .cache/fred paper/.cache/retrieval_cv/beta0.0_tau2.0_pit paper/.cache/figure_index_pit \
                  paper/.cache/cut_battery_b0.6 paper/.cache/hike_battery_b0.6 paper/.cache/vote_parse \
                  paper/.cache/live_forecast
          git commit -m "index update: weekly forecast and/or newly-completed FOMC meeting(s)" || exit 0
          git pull --rebase
          git push

      - name: Export and publish the site index
        if: steps.index.outputs.changed == 'true'
        env:
          WEB_PUSH_TOKEN: ${{ secrets.WEB_PUSH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$WEB_PUSH_TOKEN" ]; then
            echo "WEB_PUSH_TOKEN not set — skipping site index publish."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${WEB_PUSH_TOKEN}@github.com/helivan-research/fomc-personas-web.git" ../fomc-personas-web
          cd ../fomc-personas-web
          python scripts/export_pbi.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pbi.json
          git commit -m "index: weekly update (next-meeting forecast and/or new meeting)" || exit 0
          git push
